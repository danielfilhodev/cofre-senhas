name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Instala dependências
        run: uv sync

      - name: Compila o código (pega erro de sintaxe)
        run: uv run python -m py_compile main.py

      - name: Roda a suíte de testes
        run: uv run pytest -q
