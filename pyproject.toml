[project]
name = "cofre-senhas"
version = "0.1.0"
description = "Cofre de senhas local e criptografado (CLI + interface gráfica, offline)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.1",
    "customtkinter>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
